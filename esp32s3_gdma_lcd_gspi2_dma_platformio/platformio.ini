; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1-n8r2-livegrid] ; N8R2 = 8MB Flash, 2MB PSRAM. LiveTech v4 Upcycled PCB
platform = espressif32 @ ~8.0.0 ; IDF 5.5.5
board = esp32-s3-devkitc-1
framework = arduino

; --- Hardware & Memory Layout ---
;board_upload.flash_size = 8MB
;board_build.arduino.memory_type = qio_qspi

; --- Custom Partition Scheme ---
;board_build.partitions = partitions_custom_8mb.csv
board_build.partitions = default_8MB.csv

; --- Build Flags (PSRAM & CDC on Boot) ---
build_flags =
    ;-DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=2 ; Arduino core debug level (0-5)
    -DLOG_LOCAL_LEVEL=2 ; ESP-IDF log level (0-5)
    -DBOARD_HAS_PSRAM=1
    -DGPIO_MAPPING_PCB_LIVEGRID=1
; The Arduino-ESP32 framework hard-codes -DCORE_DEBUG_LEVEL=0 in CPPDEFINES.
; Remove it so it does not collide with the =5 above ("redefined" warning).
build_unflags = -DCORE_DEBUG_LEVEL=0

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
;check_skip_packages = yes

build_src_filter = +<*> -<lcd_test/> -<spi_test/>

; ---------------------------------------------------------------------------
; YD-ESP32-S3 Core Board (N16R8 - 16MB Flash, 8MB Octal PSRAM)
;   pio run -e yd-esp32-s3-n16r8 -t upload
;   pio device monitor -e yd-esp32-s3-n16r8
; ---------------------------------------------------------------------------
[env:yd-esp32-s3-n16r8-china] ; N16R8 = 16MB Flash, 8MB PSRAM Octal PSRAM
platform = espressif32 @ ~8.0.0 ; IDF 5.5.5
board = esp32-s3-devkitc-1
framework = arduino

; --- Hardware & Memory Layout ---
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv

build_flags =
    -DCORE_DEBUG_LEVEL=4 ; Arduino core debug level (0-5)
    -DLOG_LOCAL_LEVEL=4 ; ESP-IDF log level (0-5)
    -DBOARD_HAS_PSRAM=1
    -DGPIO_MAPPING_S3_DEV_BOARD=1
; Remove the framework's hard-coded -DCORE_DEBUG_LEVEL=0 (avoids "redefined").
build_unflags = -DCORE_DEBUG_LEVEL=0

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
check_skip_packages = yes
build_src_filter = +<*> -<lcd_test/> -<spi_test/>

[env:esp32-s3-devkitc1-n8r8] ; N8R8 = 8MB Flash, 8MB PSRAM Octal PSRAM
platform = espressif32 @ ~8.0.0 ; IDF 5.5.5
board = esp32-s3-devkitc-1
framework = arduino

; --- Hardware & Memory Layout ---
board_upload.flash_size = 8MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_8MB.csv

build_flags =
    -DCORE_DEBUG_LEVEL=5 ; Arduino core debug level (0-5)
    -DLOG_LOCAL_LEVEL=5 ; ESP-IDF log level (0-5)
    -DBOARD_HAS_PSRAM=1
    -DGPIO_MAPPING_S3_DEV_BOARD=1
; Remove the framework's hard-coded -DCORE_DEBUG_LEVEL=0 (avoids "redefined").
build_unflags = -DCORE_DEBUG_LEVEL=0

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
check_skip_packages = yes

; Default app: the full matrix demo in src/main.cpp.
; Exclude the standalone test apps so they do not add a second setup()/loop().
build_src_filter = +<*> -<lcd_test/> -<spi_test/>

; ---------------------------------------------------------------------------
; Standalone LCD peripheral test (src/lcd_test/main.cpp)
;   pio run -e lcd_test -t upload
;   pio device monitor -e lcd_test
; ---------------------------------------------------------------------------
[env:lcd_test]
;extends = env:esp32-s3-devkitc1-n8r8
extends = env:esp32-s3-devkitc-1-n8r2-livegrid
build_src_filter = +<*> -<main.cpp> -<spi_test/> -<spi_dma_seg_tx_loop.c>

; ---------------------------------------------------------------------------
; Standalone SPI/GCLK segmented DMA output test (src/spi_test/main.cpp)
;   pio run -e spi_test -t upload
;   pio device monitor -e spi_test
;
; To target the LiveGrid PCB instead of the S3 dev board, change the
; extends line to env:esp32-s3-devkitc-1-n8r2-livegrid.
; ---------------------------------------------------------------------------
[env:spi_test]
;extends = env:esp32-s3-devkitc1-n8r8
extends = env:esp32-s3-devkitc-1-n8r2-livegrid
build_src_filter = +<*> -<main.cpp> -<lcd_test/> -<lcd_gdma_parallel16.cpp> -<mbi_dma_interface.cpp>
