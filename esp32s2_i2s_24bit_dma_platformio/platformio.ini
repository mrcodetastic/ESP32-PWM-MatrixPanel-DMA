; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit: https://docs.platformio.org/page/projectconf.html

; ---------------------------------------------------------------------------
; Shared settings for every environment (inherited by all [env:xxx] sections)
; ---------------------------------------------------------------------------
[env]
board = lolin_s2_mini
board_build.mcu = esp32s2
framework = arduino

; Why --dtr 1 --rts 1 fixes it
;The Arduino core's USB-CDC object only transmits when TinyUSB reports the port as "connected", and that flag is set by the host's SET_CONTROL_LINE_STATE request (the DTR/RTS bits):
;USBCDC::write() returns 0 and drops the buffer when !tud_cdc_n_connected(itf).
;USBCDC::operator bool() returns that same connected flag.
;PlatformIO leaves monitor_dtr / monitor_rts unset by default, so it does not force the lines. When you pass --dtr 1 --rts 1, the monitor explicitly applies the control-line state, TinyUSB marks the interface connected, and Serial.printf() starts reaching the host. Before that, every write was silently discarded — which is why you saw "absolutely nothing" rather than partial output.

; Fix no serial output on ESP32-S2 boards (e.g. Lolin S2 Mini) when using PlatformIO monitor
monitor_dtr = 1
monitor_rts = 1

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
	-DCORE_DEBUG_LEVEL=5 ; Sets the USB mode to CDC (some core versions default differently).
	-DBOARD_HAS_PSRAM

	; ------------------------------------------------------------------
	; PSRAM placement options (two independent switches)
	;
	; MBI_OUTPUT_IN_PSRAM
	;   Controls where the MBI5135 driver's I2S/DMA output buffers live.
	;   IF defined = allocate the large DMA buffers in PSRAM (frees internal SRAM,
	;       but PSRAM DMA is slower; the driver also lowers the I2S clock).
	;   IF NOT defined = allocate them in internal SRAM (faster, uses more internal RAM).
	;
	; RGB_FRAMEBUFFER_IN_PSRAM
	;   If defined = allocate the 78x78x3 framebuffer from PSRAM at runtime.
	;   If NOT defined = keep it as a static array in internal SRAM.
	;   This is the "drawing" buffer, not the panel output buffer.
	;
	; They are independent: you can put either, both, or neither in PSRAM.
	; Recommendation RGB_FRAMEBUFFER_IN_PSRAM not defined (so in SRAM), MBI_OUTPUT_IN_PSRAM defined (so in PSRAM)

	; ------------------------------------------------------------------
	-DMBI_OUTPUT_IN_PSRAM
	;-DRGB_FRAMEBUFFER_IN_PSRAM 

; Run this command in a terminal to see Serial output?
; pio device monitor --port COMx --dtr 1 --rts 1
; or 
; pio device monitor --port COMx

; PlatformIO Serial Monitor / Arduino IDE Serial Monior - Doesn't work properly with USB CDC implementation.

monitor_speed = 115200
;monitor_filters = esp32_exception_decoder
upload_speed = 921600
check_skip_packages = yes


;lib_deps =
;	https://github.com/mrcodetastic/GFX_Lite

; ---------------------------------------------------------------------------
; Env 1: official PlatformIO espressif32 platform
;        (currently arduino-esp32 3.3.12, ESP-IDF 5.5.5)
; ---------------------------------------------------------------------------
[env:lolin_s2_mini]
platform = espressif32

; ---------------------------------------------------------------------------
; Env 2: pioarduino fork of the espressif32 platform
;        (arduino-esp32 3.x, ESP-IDF 5.5.x)
;
; The driver source guards ESP-IDF version specific APIs/register fields
; (see "Build-time ESP-IDF version guards" in
;  esp32s2_mbi5135_i2s_lcd_24bit_parallel_dma.cpp), so the same codebase builds
; against both platforms. Pin the branch/tag after the .git URL if you need a
; reproducible arduino-esp32/ESP-IDF combination, e.g.
;    platform = https://github.com/Jason2866/platform-espressif32.git#v55.03.312
; ---------------------------------------------------------------------------
[env:lolin_s2_mini_idf555]
platform = https://github.com/Jason2866/platform-espressif32.git
