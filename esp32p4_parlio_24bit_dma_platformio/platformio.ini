; ---------------------------------------------------------------------------
; Shared settings for every environment (inherited by all [env:xxx] sections)
; ---------------------------------------------------------------------------
[platformio]
default_envs = esp32-p4

[env:esp32-p4]
;platform = espressif32 @ ~8.0.0 ; IDF 5.5.5
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-p4
framework = arduino

build_flags =
    ;-DARDUINO_USB_CDC_ON_BOOT=1 ; DO NOT enable this on WaveShare Nano P4 as it's not using CDC on the supplied USB-C port.
    -DCORE_DEBUG_LEVEL=5 ; Arduino core debug level (0-5)
    -DLOG_LOCAL_LEVEL=5 ; ESP-IDF INFO level, required for profile logs
	;-DBOARD_HAS_PSRAM=1
	-DMATRIX_PROFILE=1 ; Aggregate render, framebuffer-flush, and frame-loop rates.
	;-DUPDATE_PROFILE=1 ; Detailed per-flush timings; serial logging affects MATRIX_PROFILE.

monitor_speed = 115200
upload_speed = 921600

[env:esp32-p4-bitscrambler]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-p4
framework = espidf

monitor_speed = 115200
upload_speed = 921600